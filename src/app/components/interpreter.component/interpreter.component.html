<section class="interpreter">
  <h1>Alpha Slang Translator</h1>

  <div class="actions">
    <button [class.secondary]="mode() !== 'interpret'" (click)="setMode('interpret')">
      Slang → English
    </button>
    <button [class.secondary]="mode() !== 'slangify'" (click)="setMode('slangify')">
      English → Slang
    </button>
  </div>

  <label for="in">{{ mode() === 'interpret' ? 'Alpha slang' : 'Plain English' }}</label>
  <textarea
    id="in"
    rows="5"
    placeholder="Type, paste, or use the mic..."
    [ngModel]="input()"
    (ngModelChange)="input.set($event)"
  ></textarea>

  <div class="actions">
    <button (click)="run()" [disabled]="loading() || !input().trim()">
      {{ loading() ? 'Working...' : (mode() === 'interpret' ? 'Interpret' : 'Slangify') }}
    </button>
    @if (voiceSupported) {
      <button class="secondary" (click)="toggleVoice()">
        {{ listening() ? 'Stop' : '🎤 Speak' }}
      </button>
    }
    <button class="secondary" (click)="clear()">Clear</button>
  </div>

  @if (error()) { <p class="error">{{ error() }}</p> }

  <label>{{ mode() === 'interpret' ? 'Plain English' : 'Alpha slang' }}</label>
  <div class="output">{{ output() || 'The result will show up here.' }}</div>

  @if (matches().length) {
    <p class="matches">Terms used: {{ matches().join(', ') }}</p>
  }
</section>
